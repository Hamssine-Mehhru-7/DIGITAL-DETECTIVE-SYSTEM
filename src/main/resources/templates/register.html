<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Digital Detective | Register</title><link rel="stylesheet" href="/auth-form.css"></head>
<body><main class="auth-card">
  <div class="brand"><span class="brand-mark">D</span><div><strong>DIGITAL DETECTIVE</strong><small>CREATE INVESTIGATOR ACCESS</small></div></div>
  <p class="eyebrow">02 / NEW ACCOUNT</p><h1>Create your account</h1><p class="sub">Register to save your analyses and access your own workspace.</p>
  <p class="message" th:if="${error}" th:text="${error}"></p>
  <form th:action="@{/register}" method="post">
    <label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Create a password" required>
    <label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Enter password again" required>
    <button type="submit">CREATE ACCOUNT</button>
  </form>
  <div class="links"><a href="/">← Back to home</a><a href="/login">Already registered? Login</a></div>
  <div class="foot">PRIVATE SESSION · DIGITAL DETECTIVE SYSTEM</div>
</main></body></html>
