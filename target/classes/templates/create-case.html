
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Case | Digital Detective</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .case-container {
            max-width: 750px;
            margin: 55px auto;
            padding: 30px;
            background: #111d32;
            border: 1px solid #263751;
            border-radius: 15px;
        }
        .case-container label {
            display: block;
            margin: 20px 0 8px;
            color: #dce5f2;
        }
        .case-container input,
        .case-container textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            background: #0b1425;
            color: white;
            border: 1px solid #344761;
            border-radius: 8px;
        }
        .case-container textarea {
            min-height: 150px;
            resize: vertical;
        }
        .case-container button {
            margin-top: 22px;
            padding: 13px 25px;
            background: #3978f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .case-container a { color: #70a2ff; }
        .error { color: #ff8585; }
    </style>
</head>
<body>

<div class="case-container">

    <h1>Create New Investigation</h1>
    <p>Enter the details of the investigation case.</p>

    <form th:action="@{/cases/create}" method="post">

        <label>Case Title</label>
        <input type="text" name="title"
               placeholder="Example: Suspicious Email Investigation"
               required>

        <label>Case Description</label>
        <textarea name="description"
                  placeholder="Describe the investigation..."
                  required></textarea>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <button type="submit">Save Case</button>

    </form>

    <p style="margin-top:20px;">
        <a th:href="@{/dashboard}">Back to Dashboard</a>
    </p>

</div>

</body>
</html>
