<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04080f">
  <title>Digital Detective | My Profile</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#04080f;color:#eaf6ff;font-family:Inter,Arial,sans-serif;min-height:100vh}
    .shell{max-width:960px;margin:0 auto;padding:36px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
    a{color:#42dff2;text-decoration:none}.brand{font-weight:700;letter-spacing:.04em}.panel{background:#0d1a29;border:1px solid #24405a;border-radius:12px;padding:26px;margin:18px 0}
    h1{font-size:30px;margin:8px 0}h2{font-size:19px;margin:0 0 20px}.muted{color:#9bb4c9}.field{margin:15px 0}label{display:block;color:#a9c4d8;font-size:13px;margin-bottom:7px}
    input{width:100%;background:#07111e;color:#eaf6ff;border:1px solid #29465e;border-radius:7px;padding:13px;font-size:15px}
    button{background:#0e5264;color:#eafaff;border:1px solid #27b9d0;border-radius:7px;padding:11px 18px;cursor:pointer;font-weight:700;margin-top:8px}
    .notice{padding:12px;border-radius:7px;background:#123c32;color:#a8f3d3;margin:12px 0}.error{background:#4b2028;color:#ffd0d5}
    .actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}.actions a{padding:10px 0}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><a class="brand" href="/dashboard">DIGITAL DETECTIVE</a><a href="/analysis-workspace">Back to Analysis Tool</a></div>
    <p class="muted">ACCOUNT SETTINGS</p>
    <h1>My Profile</h1>
    <p class="muted">View and update the details associated with your signed-in account.</p>

    <div class="notice" th:if="${param.updated}">Your profile was updated successfully.</div>
    <div class="notice" th:if="${param.passwordChanged}">Your password was changed successfully.</div>
    <div class="notice error" th:if="${error}" th:text="${error}"></div>

    <section class="panel">
      <h2>Personal information</h2>
      <form method="post" action="/profile/update">
        <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" required th:value="${profile.name}"></div>
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required th:value="${profile.email}"></div>
        <button type="submit">Save profile</button>
      </form>
    </section>

    <section class="panel">
      <h2>Change password</h2>
      <form method="post" action="/profile/password">
        <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"></div>
        <div class="field"><label for="newPassword">New password (at least 8 characters)</label><input id="newPassword" name="newPassword" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div>
        <button type="submit">Update password</button>
      </form>
    </section>
    <div class="actions"><a href="/dashboard">← Dashboard</a><a href="/logout">Log out</a></div>
  </main>
</body>
</html>
