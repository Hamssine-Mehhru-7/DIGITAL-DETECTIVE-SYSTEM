
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports | Digital Detective</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main style="max-width:850px;margin:45px auto;padding:25px;">
    <h1>Investigation Reports</h1>
    <p>Generate and download reports containing your saved investigation data.</p>

    <section style="padding:25px;background:#17243b;border-radius:15px;">
        <form method="post" th:action="@{/reports/generate}">

            <label>Select Investigation Case</label>
            <select name="caseId" required style="width:100%;padding:12px;margin:12px 0;">
                <option value="">Choose a case</option>
                <option th:each="entry : ${cases}"
                        th:value="${entry.key}"
                        th:text="${entry.value}">
                </option>
            </select>

            <label>Report Type</label>
            <select name="reportType" required style="width:100%;padding:12px;margin:12px 0;">
                <option value="All">Complete Investigation Report</option>
                <option value="Email">Email Analysis Report</option>
                <option value="URL">URL Analysis Report</option>
                <option value="Message">Message Analysis Report</option>
                <option value="Risk Assessment">Risk Assessment Report</option>
            </select>

            <button type="submit" class="primary-button">
                Generate & Download Report
            </button>
        </form>
    </section>

    <p><a th:href="@{/dashboard}">Back to Dashboard</a></p>
</main>
</body>
</html>
